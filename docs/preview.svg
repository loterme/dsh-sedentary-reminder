<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="A reminder card above the message composer">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1220" flood-opacity="0.12"/>
    </filter>
    <style>
      .t { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="720" height="440" fill="#F4F5F7"/>

  <!-- message composer -->
  <rect x="150" y="330" width="420" height="64" rx="14" fill="#FFFFFF" stroke="#E5E8ED"/>
  <text class="t" x="172" y="367" font-size="13" fill="#AEB4BF">Ask anything…</text>
  <circle cx="540" cy="362" r="14" fill="#2F62E8"/>
  <path d="M534 362h11m-5-5 5 5-5 5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- reminder card -->
  <g filter="url(#card-shadow)">
    <rect x="150" y="110" width="420" height="200" rx="16" fill="#FFFFFF" stroke="#E5E8ED"/>
  </g>

  <rect x="166" y="126" width="28" height="28" rx="9" fill="#EEF1F6"/>
  <g fill="none" stroke="#6C727E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="183" cy="134" r="1.9"/>
    <path d="M183 136.5l-2.3 5 3.3 1.4 1.3 5.1"/>
    <path d="M180.8 140.6l-2.9 1.4"/>
    <path d="M183 138.5l2.7-1.8"/>
  </g>

  <text class="t" x="206" y="145" font-size="14" font-weight="600" fill="#181C23">Time to move a little</text>
  <text class="t" x="206" y="167" font-size="12.5" fill="#6C727E">You have been sitting for 45 minutes.</text>
  <text class="t" x="206" y="185" font-size="12.5" fill="#6C727E">Stand up, grab some water, look into the distance.</text>

  <rect x="166" y="210" width="140" height="32" rx="9" fill="#181C23"/>
  <text class="t" x="180" y="231" font-size="12.5" font-weight="600" fill="#FFFFFF">Take a walk · 5 min</text>

  <rect x="314" y="210" width="96" height="32" rx="9" fill="#EEF1F6"/>
  <text class="t" x="326" y="231" font-size="12.5" fill="#181C23">Sit 10 more</text>

  <text class="t" x="418" y="231" font-size="12.5" fill="#6C727E">Pause 1 hour</text>

  <g stroke="#6C727E" stroke-width="1.6" stroke-linecap="round">
    <path d="M524 224h18M524 234h18" fill="none"/>
    <circle cx="530" cy="224" r="1.9" fill="#FFFFFF"/>
    <circle cx="536" cy="234" r="1.9" fill="#FFFFFF"/>
  </g>
</svg>
